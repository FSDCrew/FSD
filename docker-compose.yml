networks:
  fsd-network:
    driver: bridge
    name: fsd-network

volumes:
  pgadmin_data:
  postgres_data:

services:
  crud_db:
    image: postgres:15
    container_name: fsd-crud-db
    restart: always
    networks: 
      - fsd-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pass}
      POSTGRES_DB: ${POSTGRES_DB:-crud_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/crud_service/db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-crud_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  crud_service:
    build: ./backend/crud_service
    image: fsd/crud_service:1.0
    container_name: fsd-crud-service
    restart: always
    ports:
      - "6010:6010"
    networks:
      - fsd-network
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-crud_db}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-${POSTGRES_DB:-crud_db}}}
      DB_USER: ${DB_USER:-${POSTGRES_USER:-user}}}
      DB_PASSWORD: ${DB_PASSWORD:-${POSTGRES_PASSWORD:-pass}}}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_REGION: ${S3_REGION}
      CRUD_DATABASE_URL: ${CRUD_DATABASE_URL}
    depends_on:
      crud_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6010/status/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  crew_service:
    build: ./backend/crew_service
    image: fsd/crew_service:1.0
    container_name: fsd-crew-service
    restart: always
    ports:
      - "6011:6011"
    networks:
      - fsd-network
    env_file:
      - .env
    environment:
      CRUD_SERVICE_URL: ${CRUD_SERVICE_URL:-http://crud_service:6010}
    depends_on:
      crud_service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:6011/status/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  crew_worker:
    build: ./backend/crew_service
    image: fsd/crew_service:1.0
    container_name: fsd-crew-worker
    restart: always
    networks:
      - fsd-network
    env_file:
      - .env
    environment:
      CRUD_SERVICE_URL: ${CRUD_SERVICE_URL:-http://crud_service:6010}
    depends_on:
      crud_service:
        condition: service_healthy
    command: python -m app.run_worker

  pgadmin:
    image: dpage/pgadmin4
    container_name: fsd-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5434:80"
    depends_on:
      crud_db:
        condition: service_healthy
    networks:
      - fsd-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/misc/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build: ./frontend
    image: fsd/frontend:1.0
    container_name: fsd-frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    networks:
      - fsd-network
    depends_on:
      - crud_service
      - crew_service