name: CD | CREW Service Deployment

on:
  push:
    branches:
      - github-actions
    paths:
      - 'backend/crew_service/**'
      
env:
  # --- AWS Configuration ---
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: prod/crew-service
  ASG_NAME: crew-service-asg
  
  DOCKER_BUILD_CONTEXT: ./backend/crew_service

jobs:
  deploy:
    name: Build, Push to ECR, and Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Tag
        id: set-tag
        run: |
          # Use a short SHA of the commit as the image tag for unique versioning
          IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-8)
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.DOCKER_BUILD_CONTEXT }}
          push: true
          tags: ${{ env.IMAGE_URI }}, ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          platforms: linux/amd64

      - name: Trigger ASG Instance Refresh
        run: |
          echo "Starting Instance Refresh for ASG: ${{ env.ASG_NAME }}"

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ env.ASG_NAME }} \
            --preferences '{"MinHealthyPercentage": 90, "InstanceWarmup": 300}'
          
          echo "Instance Refresh initiated successfully."
