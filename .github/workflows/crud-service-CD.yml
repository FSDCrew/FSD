name: CD | CRUD Service Deployment

on:
  push:
    branches:
      - main
    paths:
      - 'backend/crud_service/**'
  workflow_dispatch:
      
env:
  # --- File Paths ---
  DOCKER_BUILD_CONTEXT: ./backend/crud_service
  ALEMBIC_CONTEXT: ./backend/crud_service
  MIGRATION_SCRIPT_EXECUTION_PATH: ./scripts/db_migrate_apply.sh

jobs:
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13' 
          cache: 'pip'
          
      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          cd ${{ env.ALEMBIC_CONTEXT }}
          pip install -e .

      - name: Run Migrations
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          INTERNAL_CREW_API_KEY: ${{ secrets.INTERNAL_CREW_API_KEY }}
          COGNITO_REGION: ${{ secrets.COGNITO_REGION }}
          COGNITO_USER_POOL_ID: ${{ secrets.COGNITO_USER_POOL_ID }}
          COGNITO_APP_CLIENT_ID: ${{ secrets.COGNITO_APP_CLIENT_ID }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          S3_REGION: ${{ secrets.S3_REGION }}
          CREW_SERVICE_URL: ${{ secrets.CREW_SERVICE_URL }}
          ENVIRONMENT: production
        run: |
          echo "Starting database migration..."
          cd ${{ env.ALEMBIC_CONTEXT }}
          ${{ env.MIGRATION_SCRIPT_EXECUTION_PATH }} ${{ env.ENVIRONMENT }}
          echo "Database migration complete."

  deploy:
    name: Build, Push to ECR, and Deploy
    runs-on: ubuntu-latest
    environment: production
    needs: migrate

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set Image Tag
        id: set-tag
        run: |
          # Use a short SHA of the commit as the image tag for unique versioning
          IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-8)
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
          echo "IMAGE_URI=${{ steps.login-ecr.outputs.registry }}/${{ secrets.CRUD_ECR_REPOSITORY }}:$IMAGE_TAG" >> $GITHUB_ENV

      - name: Build and Push Docker Image to ECR
        uses: docker/build-push-action@v5
        with:
          context: ${{ env.DOCKER_BUILD_CONTEXT }}
          push: true
          tags: ${{ env.IMAGE_URI }}, ${{ steps.login-ecr.outputs.registry }}/${{ secrets.CRUD_ECR_REPOSITORY }}:latest
          platforms: linux/amd64

      - name: Trigger ASG Instance Refresh
        run: |
          echo "Starting Instance Refresh for ASG: ${{ secrets.CRUD_ASG_NAME }}"

          aws autoscaling start-instance-refresh \
            --auto-scaling-group-name ${{ secrets.CRUD_ASG_NAME }} \
            --preferences '{"MinHealthyPercentage": 90, "InstanceWarmup": 300}'
          
          echo "Instance Refresh initiated successfully."
