version: 1.0
tools:
  - name: open_instagram_posts
    description: Opens and extracts caption and image URLs from one or more Instagram post pages.
    input:
      urls: string | list[string]
      examples:
        - ["https://www.instagram.com/p/DPdB40zk7Xr/", "https://www.instagram.com/p/DOYL6FljOVZ/", "https://www.instagram.com/p/DDYewRgyAWj/", "https://www.instagram.com/p/C0Du2wJu_5p/", "https://www.instagram.com/p/DMC23hCTlA9/", "https://www.instagram.com/p/DPQwwMMEn-Z/", "https://www.instagram.com/p/DDjsKyCzgrE/", "https://www.instagram.com/p/DQLp9BgEQYF/", "https://www.instagram.com/p/DDgb09cytAg/", "https://www.instagram.com/p/DPlLpG4k9JL/"]

  - name: search_internet
    description: Performs a general Google search (via Bright Data) to return summarized web results.
    input:
      query: string
      examples:
        - "latest olympics news"
        - "how to bake bread"

  - name: search_instagram
    description: Searches Google for public Instagram posts using keywords.
    input:
      query: string
      examples:
        - "cosplay singapore"
        - "travel photography tips"

  - name: open_pages
    description: Scrapes one or more webpages and extracts the main readable text content of each webpage.
    input:
      website_urls: list[string]
      examples:
        - ["https://example.com/blog/post1", "https://newswebsite.com/article/123"]

  - name: html_table_to_excel
    description: Converts an HTML table string into an Excel (.xlsx) file with row/col spans preserved as merged cells.
    input:
      html_str: string
      file_name: string (optional)
    examples:
        - html_str: """
          <table>
            <tr><td>Hello</td><td>World</td></tr>
            <tr><td>Hello</td><td>World</td></tr>
          """, file_name: "social_media_schedule.xlsx"

  - name: markdown_to_word_doc
    description: Convert Markdown to a Word (.docx) file with GitHub-flavored Markdown features preserved. Automatically removes common leading indentation so pasted/triple-quoted Markdown isn't treated as a code block.
    input:
      markdown: string
      file_name: string (optional)
    examples:
      - markdown: "# Title\n\n- [x] done\n- [ ] todo\n"
      - markdown: |
          # Report
          | A | B |
          | - | - |
          | 1 | 2 |

  - name: calculate_num_weeks
    description: Calculates the number of weeks between a start date and an end date (inclusive, rounded up). Supports multiple date formats including ISO (YYYY-MM-DD), DD-MMM-YYYY, DD/MM/YYYY, and DD-MM-YYYY.
    input:
      start_date: string
      end_date: string
    examples:
      - start_date: "01-Nov-2024", end_date: "30-Nov-2024"
      - start_date: "2024-01-01", end_date: "2024-01-07"
      - start_date: "01/11/2024", end_date: "30/11/2024"

  - name: verify_sum_equals_expected
    description: Validates that the sum of a list of numbers equals an expected total and reports whether they match.
    input:
      expected_total: number | string
      values: list[number | string]
    examples:
      - expected_total: 12, values: [3, 4, 5]
      - expected_total: "10", values: [2.5, 2.5, 5]
