state:
  fields:
    # --- Campaign Context Fields (always user-provided) ---
    theme:
      type: string
      field_kind: context
      required: true
      placeholder: "Enter your campaign theme"
    brand_description:
      type: string
      field_kind: context
      required: true
      placeholder: "Describe your brand"
    target_audience_description:
      type: string
      field_kind: context
      required: true
      placeholder: "Describe your target audience"
    start_date:
      type: date
      field_kind: context
      required: true
      placeholder: "YYYY-MM-DD"
    end_date:
      type: date
      field_kind: context
    templateId:
      type: list[AllowedTemplateId]
      field_kind: context
      required: true
      placeholder: "Select template IDs"
    orshot_schema:
      type: list[OrshotSchemaField]
      field_kind: context

    # --- Dynamic Data Fields (produced or provided depending on workflow) ---
    discovery_datasets:
      type: list[DiscoveryDataset]
      field_kind: data
      required: false
      placeholder: "Add discovery dataset references"

    marketing_research:
      type: MarketingResearchReport
      field_kind: data
      required: false
      placeholder: "Provide marketing research data"

    content_strategy:
      type: ContentStrategy
      field_kind: data
      required: false
      placeholder: "Provide content strategy"

    social_media_schedule:
      type: SocialMediaSchedule
      field_kind: data
      required: false
      placeholder: "Provide social media schedule"

    image_assets:
      type: list[ImageAsset]
      field_kind: data

    orshot_render:
      type: list[OrshotRender]
      field_kind: data

    post_captions:
      type: CopywriterOutput
      field_kind: data

tasks:
  marketing_research:
    reads:
      - field: theme
        cardinality: required
      - field: brand_description
        cardinality: required
      - field: target_audience_description
        cardinality: required
      - field: start_date
        cardinality: required
      - field: end_date
        cardinality: required
    writes:
      - field: marketing_research
        mode: replace
    key: marketing_research
    agent: market_researcher
    name: Marketing Research Task
    task_description: >
      Conduct theme-aligned market research using required web-scraping and search tools to identify competitors, trends, and relevant Instagram content, 
      then produces a structured report.
    description: >
      <important_rules>
        1. You must not make up any information. Only include information that you are confident about.
        2. You must not include any information that is not related to the topic or the brand.
        3. You must not include any information that is not supported by the data you have collected.
        4. You must not include any information that is not supported by the tools you have used.
        5. IMPORTANT: You MUST use the Markdown to Word Doc tool to save the report as a Word (.docx) file before returning the markdown report. The name of the report should be "market_research.docx".
      </important_rules>

      <context>
        1. You are to identify topics that are related to the theme of the marketing campaign.
          <theme>{theme}</theme>
        2. The brand you are preparing the market research for is described as <BRAND_DESCRIPTION>{brand_description}</BRAND_DESCRIPTION>.
        3. The target audience is described as <TARGET_AUDIENCE_DESCRIPTION>{target_audience_description}</TARGET_AUDIENCE_DESCRIPTION>.
        4. You are preparing market research to be used to guide the content strategy for the marketing campaign which will take place from <START_DATE>{start_date}</START_DATE> to <END_DATE>{end_date}</END_DATE>.
        5. <CREW_RUN_ID>{crew_run_id}</CREW_RUN_ID>
      </context>

      <your_task>
        Based on the context, you are to prepare a report summarizing the competitive landscape, emerging trends tied to "{theme}", and successful examples/reference:
          1. Your report should be formatted as markdown without '```'.
          2. Learn about topics or concepts related to the campaign theme using the Search Internet tool to help you. You MUST use the open_pages tool to open the pages and extract the text content.
          3. Identify 1-3 relevant competitors in the space using the Search Internet tool to help you. You MUST use the open_pages tool to open the pages and extract the text content.
          4. For any relevant topics related to the campaign theme, use the Search Instagram tool to gather data on recent posts related to the campaign theme. You MUST use the open_instagram_posts tool to open the posts and extract the text content.
          5. Analyze the data collected to identify patterns in content types, engagement tactics, visual styles, and posting frequencies that align with the brand and appeal to the target audience.
          6. You MUST generate a comprehensive and structured report summarizing your findings, including actionable insights, recommendations and references for the upcoming campaign.
          7. IMPORTANT You MUST use the Markdown to Word Doc tool to save the report as a Word (.docx) file before returning the markdown report. The name of the report should be "market_research.docx".
      </your_task>

      <additional_instructions>
        - When referencing instagram posts, include poster's username and post's url in the output.
      </additional_instructions>

    expected_output: >
      Generate a report that includes the following sections:
      - Executive summary
      - Competitive landscape
      - Emerging trends
      - Successful examples/references
      - Recommendations
      - References

      The final report should be formatted as markdown without '```'.

  content_strategy:
    reads:
      - field: theme
        cardinality: required
      - field: brand_description
        cardinality: required
      - field: target_audience_description
        cardinality: required
      - field: start_date
        cardinality: required
      - field: end_date
        cardinality: required
      - field: marketing_research
        cardinality: required
    writes:
      - field: content_strategy
        mode: replace
    key: content_strategy
    agent: content_strategist
    name: Content Strategy Task
    task_description: >
      Develop a high-level Instagram content strategy defining campaign phases, tone, messaging, and recommended content types.
    description: >
      <important_rules>
        1. Do not make up any information not grounded in the provided brand description, audience, or research.
        2. Do not include any calendar dates, week assignments, posting schedule, or per-post topics.
        3. The strategy must remain high-level and non-operational.
        4. You MUST ensure each phase has valid duration_in_weeks, posting_cadence, themes, objectives, and recommended_content_types.
        5. IMPORTANT: You MUST use the Markdown to Word Doc tool to save the content strategy as a Word (.docx) file before returning the markdown content strategy. The name of the content strategy should be "content_strategy.docx".
      </important_rules>

      <context>
        1. You are to develop a content strategy for an Instagram marketing campaign running from <START_DATE>{start_date}</START_DATE> to <END_DATE>{end_date}</END_DATE>.
        2. The brand is described as <BRAND_DESCRIPTION>{brand_description}</BRAND_DESCRIPTION>.
        3. The target audience is described as <TARGET_AUDIENCE_DESCRIPTION>{target_audience_description}</TARGET_AUDIENCE_DESCRIPTION>.
        4. This strategy will guide the Separate Scheduler Task. You must NOT include dates or scheduling details.
        5. The marketing research is as follows:
          <MARKETING_RESEARCH>
            {marketing_research}
          </MARKETING_RESEARCH>
        6. <CREW_RUN_ID>{crew_run_id}</CREW_RUN_ID>
      </context>

      <your_task>
        - Use the calculate-num-weeks tool to determine the <TOTAL_WEEKS> in the campaign.
        - Produce:
            1. A human-readable markdown strategy stored in `content`.
              This should include:
                  - Executive summary
                  - Brand alignment
                  - Audience alignment
                  - Explanation of each strategy phase
                  - Messaging principles
                  - Tone & voice guidelines
                  - How content types support campaign goals

            2. A structured set of fields mapped into the ContentStrategy object:
                - `global_settings`
                    *tone, voice, content pillars, messaging guidelines*
                - `phases`
                    A list of phases, each containing:
                      - name
                      - duration_in_weeks
                      - themes
                      - objectives
                      - recommended_content_types
                      - posting_cadence (e.g. posts_per_week, stories_per_week)
                      - messaging_guidelines

            IMPORTANT:
            - Do NOT assign dates, days, or weeks.
            - Do NOT calculate cadence distribution across the campaign.
            - Do NOT produce HTML tables.
            - Do NOT perform any scheduling activities.
          - Double check that the total number of weeks across phases is equal to the <TOTAL_WEEKS> using the verify_sum_equals_expected tool
          - IMPORTANT: You MUST use the Markdown to Word Doc tool to save the content strategy as a Word (.docx) file before returning the markdown content strategy. The name of the content strategy should be "content_strategy.docx".
      </your_task>

    expected_output: >
      A ContentStrategy object:
        - `content`: markdown (no backticks)
        - `global_settings`: structured dict
        - `phases`: list of StrategyPhase objects

  social_media_schedule:
    reads:
      - field: start_date
        cardinality: required
      - field: end_date
        cardinality: required
      - field: content_strategy
        cardinality: required
    writes:
      - field: social_media_schedule
        mode: replace
    key: social_media_schedule
    agent: scheduler
    name: Social Media Schedule Task
    task_description: >
      Convert the ContentStrategy phases and cadence into a fully dated Instagram posting schedule for the entire campaign.
    description: >
      <important_rules>
        1. You must derive all information strictly from:
            - the <CONTENT_STRATEGY>,
            - the brand description,
            - the target audience description,
            - the marketing research.
          You may infer details only when they logically follow from these sources.

        2. You must not invent new phases, change phase order, or alter posting cadence at the phase level.
          You may only distribute each phase’s defined weekly cadence across specific dates in that week.

        3. All scheduled items (posts, reels, stories) must remain relevant to:
            - the campaign dates,
            - the campaign theme,
            - the brand,
            - the specified audience,
            - the content strategy.
          No unrelated content, topics, or stylistic deviations.

        4. Weekly mapping must follow the phase durations in order.
          You MUST NOT manually generate the weekly phase mapping, weekly date allocation,
          or posting cadence distribution yourself.

        5. You MUST NOT manually construct ScheduleItem objects or select post types yourself.
          All schedule construction must come ONLY from the generate_social_media_schedule tool.

        6. You MUST NOT manually construct the HTML table.
          The HTML table MUST come directly from the tool output.

        7. You MUST NOT call schedule_items_to_html_table or html_table_to_excel.
          The generate_social_media_schedule tool already performs these steps internally.

        8. You MUST call ONLY the generate_social_media_schedule tool to produce the final schedule.
          No other tools may be used.
      </important_rules>

      <context>
        1. You are to develop a social media schedule for a marketing campaign to be executed on Instagram
          from <START_DATE>{start_date}</START_DATE> to <END_DATE>{end_date}</END_DATE>.
        2. The content strategy is as follows (including phases, themes, and posting cadence):
          <CONTENT_STRATEGY>
            {content_strategy}
          </CONTENT_STRATEGY> 
        3. <CREW_RUN_ID>{crew_run_id}</CREW_RUN_ID>
          
        IMPORTANT: When calling generate_social_media_schedule, you MUST pass the content_strategy_json parameter
        as a valid JSON string containing the ContentStrategy object with all required fields:
        - content (string)
        - global_settings (object)
        - phases (array of StrategyPhase objects)
      </context>

      <your_task>
        You MUST call ONLY the generate_social_media_schedule tool to generate the entire
        weekly Instagram posting schedule for the campaign.
      </your_task>

    expected_output: >
      A SocialMediaSchedule object:
        - `items`: A list of ScheduleItem objects, one for each post/story in the schedule.
          Each ScheduleItem must include:
            - id (int, unique identifier for the schedule item - auto-generated if not provided)
            - week (int, 1-based week number within the campaign)
            - phase_name (string, matching one of the ContentStrategy phases)
            - post_type (one of "POST", "STORY")
            - date (YYYY-MM-DD format)
            - theme_concept (string)
            - objective (string)
            - description (string, typically 1–2 sentences)

  copywriter:
    reads:
      - field: social_media_schedule
        cardinality: required
    writes:
      - field: post_captions
        mode: replace
    key: copywriter
    agent: copywriter_agent
    name: Copywriting Task
    task_description: >
      Generate Instagram captions, hashtags, and phrases for all items in the social media schedule.
      The tool handles iteration automatically and saves the final Word document as an artifact.
    description: >
      <important_rules>
        1. You must not make up any information. Only include information that you are confident about.
        2. You must not include any information that is not related to the topic or the brand.
        3. All captions must align with the phase_name, post_type, date, theme_concept, objective, and description provided in each schedule item.
        4. You must ensure all copy is error-free with proper grammar, spelling, and punctuation.
      </important_rules>

      <context>
        1. The social media schedule is provided here:
          <SOCIAL_MEDIA_SCHEDULE>
            {social_media_schedule}
          </SOCIAL_MEDIA_SCHEDULE>

        2. The social media schedule contains a list of schedule items. Each item has:
           - id: Unique identifier for the schedule item
           - phase_name: Name of the strategy phase (if available)
           - week: Week number within the campaign
           - date: Calendar date for the post (YYYY-MM-DD format)
           - post_type: Type of content ("POST" or "STORY")
           - theme_concept: Theme or concept for the post's content
           - objective: Objective for the post (e.g., awareness, engagement, CTA)
           - description: Detailed description of the post's content

        3. Your crew run ID is: <CREW_RUN_ID>{crew_run_id}</CREW_RUN_ID>

        IMPORTANT: When calling generate_copywriting_for_schedule, you MUST pass the social_media_schedule_json parameter
        as a valid JSON string containing the SocialMediaSchedule object with all required fields, and ensure the JSON string
        does not contain any backslashes (i.e., it should be properly escaped and formatted).
      </context>

      <your_task>
        **STEP 1: Call the Tool**
        Call the `generate_copywriting_for_schedule` tool with:
        - social_media_schedule_json: The entire social_media_schedule object as a JSON string (convert the schedule object to JSON format without any backslashes.)
        - crew_run_id: "{crew_run_id}" (use the crew_run_id value shown above in the context)

        **STEP 2: Verify and Output**
        The tool will:
        1. Process ALL items in the schedule automatically (handles iteration in code)
        2. Generate copywriting for each item (captions, hashtags, phrases)
        3. Create structured PostCaption objects for each item
        4. Convert results to markdown and save as Word document artifact
        5. Return a CopywriterOutput JSON object containing all PostCaption objects

        **VERIFY:** Check if the tool returned an error message starting with "Error:". If it did, report that error.
        Otherwise, output the JSON string returned by the tool as your final result (this JSON contains the CopywriterOutput object that gets written to the post_captions field).

        **IMPORTANT NOTES:**
        - The tool handles ALL iteration and processing automatically - you don't need to loop through items
        - The tool ensures ALL items are processed - no items will be skipped
        - The tool automatically saves the Word document as an artifact
        - Simply call the tool once with the entire schedule and output the returned JSON string
      </your_task>

    expected_output: >
      Return a CopywriterOutput JSON object containing a list of PostCaption objects, one for each schedule item.
      Each PostCaption must include:
      - schedule_item_id: The ID of the schedule item
      - caption: The generated Instagram caption text
      - hashtags: Array of hashtag strings (without '#' prefix)
      - phrases: Array of 2-3 phrase/tagline strings
      
      The output must be valid JSON matching the CopywriterOutput schema.
      Do NOT describe whether the output meets requirements.
      Do NOT evaluate or summarize the structure.
  
  image_generator:
    reads:
      - field: social_media_schedule
        cardinality: required
    writes:
      - field: image_assets
        mode: replace
    key: image_generator
    agent: image_generator_agent
    name: Image Generation Task
    task_description: >
      Generate images for all items in the social media schedule.
      The tool handles iteration automatically and generates images based on each schedule item's context.
    description: >
      <important_rules>
        1. You must not make up any information. Only include information that you are confident about.
        2. You must not include any information that is not related to the topic or the brand.
        3. All images must align with the theme_concept, description, objective, and post_type provided in each schedule item.
      </important_rules>

      <context>
        1. The social media schedule is provided here:
          <SOCIAL_MEDIA_SCHEDULE>
            {social_media_schedule}
          </SOCIAL_MEDIA_SCHEDULE>
          
          IMPORTANT: Count the number of items in the schedule. The output must contain exactly this many ImageAsset objects.

        2. Your crew run ID is: <CREW_RUN_ID>{crew_run_id}</CREW_RUN_ID>
      </context>

      <your_task>
        **STEP 1: Call the Tool**
        Call the `generate_images_for_schedule` tool with:
        - social_media_schedule_json: The entire social_media_schedule object as a JSON string (convert the schedule object to JSON)
        - crew_run_id: "{crew_run_id}" (use the crew_run_id value shown above in the context)

        **STEP 2: Output the Result**
        The tool will:
        1. Process ALL items in the schedule automatically (handles iteration in code)
        2. Generate a detailed image prompt for each item based on its theme_concept, description, objective, and post_type
        3. Generate images using Imagen for each item (images will be text-free for use in poster renders)
        4. Save all images as artifacts
        5. Return a JSON array of ImageAsset objects (one per schedule item)

        **CRITICAL OUTPUT INSTRUCTIONS:**
        After calling the tool, you will receive a JSON array string. You MUST output this JSON array EXACTLY as-is.
        
        **DO NOT:**
        - Extract URLs from the JSON
        - Convert URLs to a newline-separated string
        - Modify the JSON structure
        - Add any text before or after the JSON
        - Parse or reformat the JSON
        
        **DO:**
        - Output the exact JSON array string returned by the tool
        - Copy the tool's return value directly to your output
        - Ensure your output starts with "[" and ends with "]"
        
        **VERIFY BEFORE OUTPUTTING:**
        1. Check if the tool returned an error message starting with "Error:". If it did, report that error.
        2. Count the number of ImageAsset objects in the tool's return value.
        3. Count the number of items in the social_media_schedule provided in the context above.
        4. Verify that these two counts match. If they don't match, DO NOT output the result. Instead, report an error indicating the mismatch.
        5. If the counts match and there are no errors, output the tool's return value EXACTLY as returned, without any modifications.

        **IMPORTANT NOTES:**
        - The tool handles ALL iteration and processing automatically - you don't need to loop through items
        - The tool should ensure ALL items get images generated - no items should be skipped
        - If the tool returns fewer ImageAsset objects than schedule items, this indicates a failure that must be reported
        - Images are generated without text (text-free) for use in poster renders
        - Your output must be the exact JSON string returned by the tool - no modifications whatsoever
        - CRITICAL: Always verify the count matches before outputting
      </your_task>

    expected_output: >
      A valid JSON List of ImageAsset objects (starting with '[').
      
      CRITICAL REQUIREMENTS:
      1. The output must be a JSON array EXACTLY as returned by the tool.
      2. The output must be a valid JSON array containing ImageAsset objects.
      3. Each ImageAsset object must contain:
         - schedule_item_id: an integer matching an item ID from the schedule
         - image_url: a valid S3 URL string
      
      VALIDATION CHECK (for guardrail):
      - Verify the output is a valid JSON array (starts with '[' and ends with ']')
      - Verify each element in the array is a valid ImageAsset object with schedule_item_id and image_url fields
      - Count the number of ImageAsset objects in the output array
      - Note: The exact count requirement (matching schedule items) is verified by the agent before outputting
      
      OUTPUT FORMAT:
      - Output the exact JSON array string returned by the tool
      - Do NOT extract URLs
      - Do NOT output URLs as a newline-separated string
      - Do NOT modify the JSON structure
      - Do NOT add any text before or after the JSON
      - Output ONLY the JSON array string, nothing else
      - Do NOT describe whether the output meets requirements
      - Do NOT evaluate or summarize the structure
      
      NOTE: The agent is responsible for verifying that the array length matches the schedule item count before outputting.
      The guardrail validates the structure and format, but relies on the agent to ensure completeness.      

  orshot_render:
    reads:
      - field: templateId
        cardinality: required
      - field: orshot_schema
        cardinality: required
      - field: social_media_schedule
        cardinality: required
      - field: image_assets
        cardinality: optional
    writes:
      - field: orshot_render
        mode: replace
    key: orshot_render
    agent: orshot_template_mapper
    name: Orshot Render Task
    task_description: >
      Generate Orshot renders for all items in the social media schedule.
      The tool handles iteration automatically and generates renders based on each schedule item's context.
    description: >
      <important_rules>
        1. You must not make up any information. Only include information that you are confident about.
        2. You must not include any information that is not related to the topic or the brand.
        3. All renders must align with the theme_concept, description, objective, and post_type provided in each schedule item.
      </important_rules>

      <context>
        1. The social media schedule is provided here:
          <SOCIAL_MEDIA_SCHEDULE>
            {social_media_schedule}
          </SOCIAL_MEDIA_SCHEDULE>

        2. Available image assets (optional):
          <IMAGE_ASSETS>
            {image_assets}
          </IMAGE_ASSETS>

        3. Template configuration:
        - Template ID: {templateId}
        - Schema: {orshot_schema}
        
        4. Your crew run ID is: <CREW_RUN_ID>{crew_run_id}</CREW_RUN_ID>

        IMPORTANT: When calling generate_orshots_for_schedule, you MUST pass:
        - social_media_schedule_json: The entire social_media_schedule object as a JSON string
        - image_assets_json: The image_assets list as a JSON string (or empty string "" if not provided)
        - template_id: The templateId value
        - orshot_schema_json: The orshot_schema list as a JSON string
        - crew_run_id: The crew_run_id value
      </context>

      <your_task>
        **STEP 1: Prepare Inputs**
        - Extract template_id: If templateId is a list, use the first element (it should be an integer). If it's already a single value, use it directly.
        - Convert image_assets to JSON: If image_assets is provided, convert it to a JSON string. If not provided or empty, use empty string "".
        - Convert orshot_schema to JSON: Convert the orshot_schema list to a JSON string.

        **STEP 2: Call the Tool**
        Call the `generate_orshots_for_schedule` tool with:
        - social_media_schedule_json: The entire social_media_schedule object as a JSON string (convert the schedule object to JSON)
        - image_assets_json: The image_assets list as a JSON string (convert to JSON, or empty string "" if not provided)
        - template_id: The templateId value (extract first element if it's a list, otherwise use directly)
        - orshot_schema_json: The orshot_schema list as a JSON string (convert to JSON)
        - crew_run_id: "{crew_run_id}" (use the crew_run_id value shown above in the context)

        **STEP 2: Output the Result**
        The tool will:
        1. Process ALL items in the schedule automatically (handles iteration in code)
        2. Generate text modifications for each item based on its context and the schema
        3. Map images from image_assets to each item (if available)
        4. Generate Orshot renders for each item
        5. Return a JSON array of OrshotRender objects (one per schedule item)

        **CRITICAL OUTPUT INSTRUCTIONS:**
        After calling the tool, you will receive a JSON array string. You MUST output this JSON array EXACTLY as-is.
        
        **DO NOT:**
        - Extract URLs from the JSON
        - Convert URLs to a newline-separated string
        - Modify the JSON structure
        - Add any text before or after the JSON
        - Parse or reformat the JSON
        
        **DO:**
        - Output the exact JSON array string returned by the tool
        - Copy the tool's return value directly to your output
        - Ensure your output starts with "[" and ends with "]"
        
        **VERIFY:** Check if the tool returned an error message starting with "Error:". If it did, report that error.
        Otherwise, output the tool's return value EXACTLY as returned, without any modifications.

        **IMPORTANT NOTES:**
        - The tool handles ALL iteration and processing automatically - you don't need to loop through items
        - The tool ensures ALL items get renders generated - no items will be skipped
        - The tool automatically maps images and generates text modifications for each item
        - Simply call the tool once with the entire schedule and output the returned JSON string
      </your_task>

    expected_output: >
      A valid JSON List of OrshotRender objects (starting with '[').
      Each OrshotRender must include:
      - schedule_item_id: The ID of the schedule item
      - render_url: The S3 URL of the rendered image
      
      CRITICAL: Output the JSON array EXACTLY as returned by the tool.
      Do NOT extract URLs.
      Do NOT output URLs as a newline-separated string.
      Do NOT modify the JSON structure.
      Do NOT add any text before or after the JSON.
      Output ONLY the JSON array string, nothing else.
      Do NOT describe whether the output meets requirements.
      Do NOT evaluate or summarize the structure.
