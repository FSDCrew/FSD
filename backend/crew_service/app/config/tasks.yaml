        3. The target audience is described as <TARGET_AUDIENCE_DESCRIPTION>{target_audience_description}</TARGET_AUDIENCE_DESCRIPTION>.
        4. You are developing the schedule to guide content creation, including copywriting and visual design.
        5. The marketing research is as follows:
