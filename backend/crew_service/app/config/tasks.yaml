state:
  fields:
    # --- Campaign Context Fields (always user-provided) ---
    theme:
      type: string
      field_kind: context
    brand_description:
      type: string
      field_kind: context
    target_audience_description:
      type: string
      field_kind: context
    start_date:
      type: date
      field_kind: context
    end_date:
      type: date
      field_kind: context
    image_description:
      type: string
      field_kind: context
    templateId:
      type: list[AllowedTemplateId]
      field_kind: context
    orshot_schema:
      type: list[OrshotSchemaField]
      field_kind: context

    # --- Dynamic Data Fields (produced or provided depending on workflow) ---
    discovery_datasets:
      type: list[DiscoveryDataset]
      field_kind: data

    marketing_research:
      type: MarketingResearchReport
      field_kind: data

    content_strategy:
      type: ContentStrategy
      field_kind: data

    social_media_schedule:
      type: SocialMediaSchedule
      field_kind: data

    image_assets:
      type: string
      field_kind: data

    orshot_render:
      type: string
      field_kind: data

    post_captions:
      # type: PostCaptions
      type: string
      field_kind: data

tasks:
  marketing_research:
    reads:
      - field: theme
        cardinality: required
      - field: brand_description
        cardinality: required
      - field: target_audience_description
        cardinality: required
      - field: start_date
        cardinality: required
      - field: end_date
        cardinality: required
    writes:
      - field: marketing_research
        mode: replace
    key: marketing_research
    agent: market_researcher
    name: Marketing Research Task
    task_description: >
      Conduct theme-aligned market research using required web-scraping and search tools to identify competitors, trends, and relevant Instagram content,
      then produces a structured report.
    description: >
      <important_rules>
        1. You must not make up any information. Only include information that you are confident about.
        2. You must not include any information that is not related to the topic or the brand.
        3. You must not include any information that is not supported by the data you have collected.
        4. You must not include any information that is not supported by the tools you have used.
        5. You must not include any information that is not supported by the data you have collected.
        6. You must not include any information that is not supported by the tools you have used.
        7. You must not include any information that is not supported by the data you have collected.
        8. You must not include any information that is not supported by the tools you have used.
      </important_rules>

      <context>
        1. You are to identify topics that are related to the theme of the marketing campaign.
          <theme>{theme}</theme>
        2. The brand you are preparing the market research for is described as <BRAND_DESCRIPTION>{brand_description}</BRAND_DESCRIPTION>.
        3. The target audience is described as <TARGET_AUDIENCE_DESCRIPTION>{target_audience_description}</TARGET_AUDIENCE_DESCRIPTION>.
        4. You are preparing market research to be used to guide the content strategy for the marketing campaign which will take place from <START_DATE>{start_date}</START_DATE> to <END_DATE>{end_date}</END_DATE>.
        5. <CREW_RUN_ID>{crew_run_id}</CREW_RUN_ID>
      </context>

      <your_task>
        Based on the context, you are to prepare a report summarizing the competitive landscape, emerging trends tied to "{theme}", and successful examples/reference:
          1. Your report should be formatted as markdown without '```'.
          2. Learn about topics or concepts related to the campaign theme using the Search Internet tool to help you.
          3. Identify 1-3 relevant competitors in the space using the Search Internet tool to help you.
          4. For any relevant topics related to the campaign theme, use the Search Instagram tool to gather data on recent posts related to the campaign theme
          5. Analyze the data collected to identify patterns in content types, engagement tactics, visual styles, and posting frequencies that align with the brand and appeal to the target audience.
          6. You MUST generate a comprehensive and structured report summarizing your findings, including actionable insights, recommendations and references for the upcoming campaign.
          7. You MUST use the Markdown to Word Doc tool to save the report as a Word (.docx) file before returning the markdown report. The name of the report should be "market_research.docx".
      </your_task>

      <additional_instructions>
        - When referencing instagram posts, include poster's username and post's url in the output.
      </additional_instructions>

    expected_output: >
      Generate a report that includes the following sections:
      - Executive summary
      - Competitive landscape
      - Emerging trends
      - Successful examples/references
      - Recommendations
      - References

      The final report should be formatted as markdown without '```'.

  content_strategy:
    reads:
      - field: theme
        cardinality: required
      - field: brand_description
        cardinality: required
      - field: target_audience_description
        cardinality: required
      - field: start_date
        cardinality: required
      - field: end_date
        cardinality: required
      - field: marketing_research
        cardinality: required
    writes:
      - field: content_strategy
        mode: replace
    key: content_strategy
    agent: content_strategist
    name: Content Strategy Task
    task_description: >
      Develop a high-level Instagram content strategy defining campaign phases, tone, messaging, and recommended content types.
    description: >
      <important_rules>
        1. Do not make up any information not grounded in the provided brand description, audience, or research.
        2. Do not include any calendar dates, week assignments, posting schedule, or per-post topics.
        3. The strategy must remain high-level and non-operational.
        4. You MUST ensure each phase has valid duration_in_weeks, posting_cadence, themes, objectives, and recommended_content_types.
      </important_rules>

      <context>
        1. You are to develop a content strategy for an Instagram marketing campaign running from <START_DATE>{start_date}</START_DATE> to <END_DATE>{end_date}</END_DATE>.
        2. The brand is described as <BRAND_DESCRIPTION>{brand_description}</BRAND_DESCRIPTION>.
        3. The target audience is described as <TARGET_AUDIENCE_DESCRIPTION>{target_audience_description}</TARGET_AUDIENCE_DESCRIPTION>.
        4. This strategy will guide the Separate Scheduler Task. You must NOT include dates or scheduling details.
        5. The marketing research is as follows:
          <MARKETING_RESEARCH>
            {marketing_research}
          </MARKETING_RESEARCH>
        6. <CREW_RUN_ID>{crew_run_id}</CREW_RUN_ID>
      </context>

      <your_task>
        - Use the calculate-num-weeks tool to determine the <TOTAL_WEEKS> in the campaign.
        - Produce:
            1. A human-readable markdown strategy stored in `content`.
              This should include:
                  - Executive summary
                  - Brand alignment
                  - Audience alignment
                  - Explanation of each strategy phase
                  - Messaging principles
                  - Tone & voice guidelines
                  - How content types support campaign goals

            2. A structured set of fields mapped into the ContentStrategy object:
                - `global_settings`
                    *tone, voice, content pillars, messaging guidelines*
                - `phases`
                    A list of phases, each containing:
                      - name
                      - duration_in_weeks
                      - themes
                      - objectives
                      - recommended_content_types
                      - posting_cadence (e.g. posts_per_week, stories_per_week)
                      - messaging_guidelines

            IMPORTANT:
            - Do NOT assign dates, days, or weeks.
            - Do NOT calculate cadence distribution across the campaign.
            - Do NOT produce HTML tables.
            - Do NOT perform any scheduling activities.
          - Double check that the total number of weeks across phases is equal to the <TOTAL_WEEKS> using the verify_sum_equals_expected tool
          - You MUST the Markdown to Word Doc tool to save the content strategy as a Word (.docx) file before returning the markdown content strategy.
            The name of the content strategy should be "content_strategy.docx".
      </your_task>

    expected_output: >
      A ContentStrategy object:
        - `content`: markdown (no backticks)
        - `global_settings`: structured dict
        - `phases`: list of StrategyPhase objects

  social_media_schedule:
    reads:
      - field: start_date
        cardinality: required
      - field: end_date
        cardinality: required
      - field: content_strategy
        cardinality: required
    writes:
      - field: social_media_schedule
        mode: replace
    key: social_media_schedule
    agent: scheduler
    name: Social Media Schedule Task
    task_description: >
      Convert the ContentStrategy phases and cadence into a fully dated Instagram posting schedule for the entire campaign.
    description: >
      <important_rules>
        1. You must derive all information strictly from:
            - the <CONTENT_STRATEGY>,
            - the brand description,
            - the target audience description,
            - the marketing research.
          You may infer details only when they logically follow from these sources.

        2. You must not invent new phases, change phase order, or alter posting cadence at the phase level.
          You may only distribute each phase’s defined weekly cadence across specific dates in that week.

        3. All scheduled items (posts, reels, stories) must remain relevant to:
            - the campaign dates,
            - the campaign theme,
            - the brand,
            - the specified audience,
            - the content strategy.
          No unrelated content, topics, or stylistic deviations.

        4. Weekly mapping must follow the phase durations in order.
          You MUST NOT manually generate the weekly phase mapping, weekly date allocation,
          or posting cadence distribution yourself.

        5. You MUST NOT manually construct ScheduleItem objects or select post types yourself.
          All schedule construction must come ONLY from the generate_social_media_schedule tool.

        6. You MUST NOT manually construct the HTML table.
          The HTML table MUST come directly from the tool output.

        7. You MUST NOT call schedule_items_to_html_table or html_table_to_excel.
          The generate_social_media_schedule tool already performs these steps internally.

        8. You MUST call ONLY the generate_social_media_schedule tool to produce the final schedule.
          No other tools may be used.
      </important_rules>

      <context>
        1. You are to develop a social media schedule for a marketing campaign to be executed on Instagram
          from <START_DATE>{start_date}</START_DATE> to <END_DATE>{end_date}</END_DATE>.
        2. The content strategy is as follows (including phases, themes, and posting cadence):
          <CONTENT_STRATEGY>
            {content_strategy}
          </CONTENT_STRATEGY> 
        3. <CREW_RUN_ID>{crew_run_id}</CREW_RUN_ID>
          
        IMPORTANT: When calling generate_social_media_schedule, you MUST pass the content_strategy_json parameter
        as a valid JSON string containing the ContentStrategy object with all required fields:
        - content (string)
        - global_settings (object)
        - phases (array of StrategyPhase objects)
      </context>

      <your_task>
        You MUST call ONLY the generate_social_media_schedule tool to generate the entire
        weekly Instagram posting schedule for the campaign.
      </your_task>

    expected_output: >
      A SocialMediaSchedule object:
        - `items`: A list of ScheduleItem objects, one for each post/story/reel in the schedule.
          Each ScheduleItem must include:
            - week (int, 1-based week number within the campaign)
            - phase_name (string, matching one of the ContentStrategy phases)
            - post_type (one of "Post", "Story", "Reel")
            - date (YYYY-MM-DD format)
            - theme_concept (string)
            - objective (string)
            - description (string, typically 1–2 sentences)
            - notes (optional string, e.g. CTAs, hashtags, mentions)

  copywriter:
    reads:
      - field: theme
        cardinality: required
      - field: brand_description
        cardinality: required
      - field: target_audience_description
        cardinality: required
      - field: content_strategy
        cardinality: optional
    writes:
      - field: post_captions
        mode: replace
    key: copywriter
    agent: copywriter_agent
    name: Copywriting Task
    task_description: >
      Generate Instagram post captions, hashtags, and phrases. If content strategy is provided, generate for every post.
      If content strategy is missing, generate creative ideas based on theme, brand, and target audience.
    description: >
      <important_rules>
        1. You must not make up any information. Only include information that you are confident about.
        2. You must not include any information that is not related to the topic or the brand.
        3. All captions must align with the brand voice and target audience.
        4. You must carefully review all copy to ensure it is error-free with proper grammar, spelling, and punctuation.
      </important_rules>

      <context>
        1. The theme of the marketing campaign is described as <THEME>{theme}</THEME>.
        2. The brand you are creating copy for is described as <BRAND_DESCRIPTION>{brand_description}</BRAND_DESCRIPTION>.
        3. The target audience is described as <TARGET_AUDIENCE_DESCRIPTION>{target_audience_description}</TARGET_AUDIENCE_DESCRIPTION>.
        4. The content strategy (if provided) is as follows:
          <content_strategy>
            {content_strategy}
          </content_strategy>
      </context>

      <tools>
        - name: markdown_to_word_doc
          description: Convert Markdown to a Word (.docx) file with GitHub-flavored Markdown features preserved. Automatically removes common leading indentation so pasted/triple-quoted Markdown isn't treated as a code block.
          input:
            markdown: string
          examples:
            - markdown: "# Title\n\n- [x] done\n- [ ] todo\n"
            - markdown: |
                # Report
                | A | B |
                | - | - |
                | 1 | 2 |
      </tools>

      <markdown_formatting_rules>
        1. **Hashtag Formatting:** To prevent hashtags from being interpreted as markdown headers, format them in one of these ways:
           - Use backticks: `#hashtag` (recommended)
           - Escape with backslash: \#hashtag
           - Put hashtags in a code block or inline code
           - Place hashtags on lines that are NOT at the start of a paragraph
        2. **Structure:** Use proper markdown headings (##, ###) to organize content by post or section.
        3. **Lists:** Use markdown list syntax (- or *) for hashtag sets and phrases.
        4. **No Code Blocks:** Do NOT wrap the entire output in ``` markdown code blocks.
        5. **Clean Formatting:** Ensure proper spacing and line breaks for readability.
      </markdown_formatting_rules>

      <your_task>
        You must determine which mode to operate in based on whether content_strategy is provided.

        **IF CONTENT_STRATEGY IS PROVIDED:**
        For every post identified in the content strategy:
          1. Analyze the post's theme, objective, and description.
          2. Generate a compelling Instagram caption that:
             - Opens with an engaging hook
             - Tells a story or provides value
             - Includes a clear call-to-action (CTA)
             - Aligns with the brand voice and target audience
             - Is optimized for Instagram (appropriate length, emoji usage, formatting)
          3. Generate a strategic hashtag set (5-10 hashtags) including:
             - Broad/trending hashtags relevant to the theme
             - Niche hashtags specific to the target audience
             - Campaign-specific or branded hashtags
             - Format hashtags using backticks (e.g., `#hashtag`) to prevent markdown header interpretation
          4. Generate 2-3 engaging phrases or taglines that:
             - Capture the essence of the post's message
             - Can be used as alternative captions or in other campaign materials
             - Are memorable and shareable
          5. Carefully review and refine all copy to ensure it is error-free with proper grammar, spelling, and punctuation.
          6. Format the output in clean markdown, organizing by post with clear headings (##, ###) and labels for captions, hashtags, and phrases.
          7. Ensure all hashtags are properly formatted with backticks (e.g., `#hashtag`) to prevent markdown parsing issues.
          8. **CRITICAL STEP:** Use the `markdown_to_word_doc` tool to convert your output.
             - The `markdown` argument MUST be the **full text string** of the report you just generated.
             - Do NOT pass a dictionary or schema definition (e.g., `{{'type': 'str'}}`).
             - Pass the actual string content directly.

        **IF CONTENT_STRATEGY IS MISSING:**
        Generate creative content ideas based on the theme, brand, and target audience:
          1. Create 3-5 sample post captions showcasing different angles:
             - Different hooks and storytelling approaches
             - Various CTAs and engagement strategies
             - Different tones (inspirational, educational, entertaining, etc.)
          2. Generate a comprehensive hashtag list (15-20 hashtags) including:
             - Broad hashtags relevant to the theme
             - Niche hashtags for the target audience
             - Branded hashtag suggestions
             - Format hashtags using backticks (e.g., `#hashtag`) to prevent markdown header interpretation
          3. Generate 5-7 memorable phrases and taglines that:
             - Capture the brand essence
             - Resonate with the target audience
             - Can be used across different campaign materials
          4. Carefully review and refine all copy to ensure it is error-free with proper grammar, spelling, and punctuation.
          5. Format the output in clean markdown as a collection of creative ideas with clear sections and headings.
          6. Ensure all hashtags are properly formatted with backticks (e.g., `#hashtag`) to prevent markdown parsing issues.
          7. **CRITICAL STEP:** Use the `markdown_to_word_doc` tool to convert your output.
             - The `markdown` argument MUST be the **full text string** of the report you just generated.
             - Do NOT pass a dictionary or schema definition.
             - Pass the actual string content directly.

        Regardless of mode, ensure all output is:
        - On-brand and aligned with brand voice
        - Tailored to the target audience
        - Engaging and optimized for Instagram
        - Free of grammar, spelling, and punctuation errors
      </your_task>

    expected_output: >
      Generate markdown-formatted content with proper hashtag formatting (using backticks like `#hashtag`).
      
      If content strategy is provided:
      - For each post: caption, hashtags, and phrases clearly labeled and organized with markdown headings.
      
      If content strategy is missing:
      - A collection of creative ideas including sample captions, hashtag suggestions, and memorable phrases with clear markdown sections.
      
      After generating the markdown, convert it to a Word document using the markdown_to_word_doc tool.
      Format as markdown without wrapping in ``` code blocks.
      Do NOT describe whether the output meets requirements.
      Only output the captions, hashtags, and phrases themselves in markdown format.
  
  image_generator:
    reads:
      - field: theme
        cardinality: required
      - field: brand_description
        cardinality: required
      - field: target_audience_description
        cardinality: required
      - field: image_description
        cardinality: required
    writes:
      - field: image_assets
        mode: replace
    key: image_generator
    agent: image_generator_agent
    name: Image Generation Task
    task_description: >
      Create images used to create orshot renders.
    description: >
      <important_rules>
        1. You must not make up any information. Only include information that you are confident about.
        2. You must not include any information that is not related to the topic or the brand.
      </important_rules>

      <tools>
        - name: generate_imagen_tool
          description: Generates an image based on a textual prompt and provides a secure S3 link.
          input:
            prompt: string
          examples:
            - prompt: "A serene beach at sunset with palm trees and gentle waves."
      </tools>

      <context>
        1. You are to create high-quality images for a marketing campaign to be executed on instagram.
        2. The theme of the marketing campaign is described as <THEME>{theme}</THEME>.
        3. The brand you are creating images for is described as <BRAND_DESCRIPTION>{brand_description}</BRAND_DESCRIPTION>.
        4. The target audience is described as <TARGET_AUDIENCE_DESCRIPTION>{target_audience_description}</TARGET_AUDIENCE_DESCRIPTION>.
        5. The specific image requirements are described as <IMAGE_DESCRIPTION>{image_description}</IMAGE_DESCRIPTION>.
      </context>

      <your_task>
        Based on the context, you are to create high-quality images that align with the content strategy.
          1. Analyze the content strategy to identify key themes, concepts, and visual styles needed for the campaign.
          2. For each identified image requirement, generate a detailed prompt that captures the desired aesthetics, mood, and elements.
          3. Use the generate_imagen_tool tool to create each image based on the prompts.
            - parameters: prompt, {crew_run_id}
          4. Collect and output the S3 links of all generated images.
      </your_task>

    expected_output: >
      A list of S3 links of the generated images, one per line.

  orshot_render:
    reads:
      - field: templateId
        cardinality: required
      - field: orshot_schema
        cardinality: required
      - field: theme
        cardinality: required
      - field: brand_description
        cardinality: required
      - field: target_audience_description
        cardinality: required

      - field: image_assets
        cardinality: optional
    writes:
      - field: orshot_render
        mode: replace
    key: orshot_render
    agent: orshot_template_mapper
    name: Orshot Render Task
    task_description: >
      Render an instagram post or story using the Orshot.
    description: >
      <important_rules>
        1. **DATA INTEGRITY:** Do not make up information. Extract facts strictly from the <context>.
        2. **STYLING:** Convert natural language style descriptions into CamelCase CSS properties using dot notation in the `modifications` object (e.g. "field.fontSize": "20px").
        3. **TOOL USAGE:** You must call `orshot_render_tool` with THREE specific arguments: `templateId` (int), `modifications` (dict), and `crew_run_id` (string). Do not pass a single JSON string.
        4. **OPTIONAL INPUTS:** If certain inputs are optional and not present, it would be NOT PROVIDED BY USER. Ignore this field and do not attempt to extract data from it.
        5. **IMPORTANT:** If the Orshot tool returns an error message starting with "Error:", 
        STOP immediately. Do NOT generate a fake link. Do NOT try to fix it blindly.
        Your final answer must be the exact error message returned by the tool.
      </important_rules>

      <context>
        **1. Configuration:**
        - Crew Run ID: {crew_run_id}
        - Template ID: {templateId}
        - Schema: {orshot_schema}
        
        **2. Creative Core:**
        - Theme: "{theme}"
        - Brand: "{brand_description}"
        - Audience: "{target_audience_description}"
        
        **3. Assets:**
        - Available Images: "{image_assets}"
      </context>

      <tools>
        - name: orshot_render_tool
          description: Sends a pre-constructed JSON payload to the Orshot API to generate a render.
          input:
            payload: string
          examples:
            - payload: >
                {
                  "templateId": 1201,
                  "modifications": {
                    "canvasBackgroundColor": "#FFFFFF",
                    "catchphrase": "Cafes in paris",
                    "catchphrase.fontSize": "24px",
                    ...
                  }
                }
        
        - name: generate_imagen_tool
          description: Generates an image based on a textual prompt and provides a secure S3 link.
          input:
            prompt: string
          examples:
            - prompt: "A serene beach at sunset with palm trees and gentle waves."
      </tools>

      <your_task>
        Iterate through every field in the **Schema** and populate the `modifications` object:

        **PART 1: TEXT FIELDS**
        For each text field in the **Schema**:
           1. **ANALYZE:** Read the field's `description` to understand the specific intent (e.g., "Catchy Title", "Sale CTA") and constraints (e.g., "Max 3 words").
           2. **GENERATE:** Create creative text based on the **Campaign Theme**, **Brand Description**, and **Target Audience**.
           3. **REFINEMENT:** - Regardless of the source, **Rewrite/Summarize** the text to strictly match the length/format constraints defined in the Schema Description (e.g., "Max 3 words").

        **PART 2: IMAGE FIELDS**
        For each image field:
           1. **CHECK ASSETS:** Look for a valid S3 URL in "Available Images".
           2. **DECISION:**
              - **IF FOUND:** Map the existing S3 URL directly to the field.
              - **IF NOT FOUND:** You must generate a new image:
                  a. **ANALYZE:** Synthesize the **Schema Field Description** (user input) with the **Campaign Theme** and **Brand Voice** to understand the specific visual requirement.
                  b. **PROMPT ENGINEERING:** Rewrite this requirement into a detailed, high-quality prompt for the image generator. Explicitly describe the subject, style, lighting, and mood.
                  c. **GENERATE:** Call the `generate_imagen_tool` tool using your optimized prompt.
                  d. **MAP:** Use the S3 URL returned by the tool.
        
        **PART 3: BACKGROUND FIELDS**
        For each background field:
           1. **ANALYZE:** Check if the description specifies a color.
           2. **GENERATE:** Determine the best HEX color code (e.g., "#FFFFFF") based on the description or the Campaign Theme/Brand.
           3. **MAP:** Assign strictly the HEX string to the field key.

        **PART 4: STYLING (CSS)**
        For every field (TEXT or IMAGE): (skip BACKGROUND fields)
           - Analyze the Schema Description for visual cues (e.g., "Blue background", "Bold font", "Opacity 50%").
           - Convert these into **CamelCase CSS properties** with dot notation.
           - Add them to the `modifications` object (e.g., `"headline.color": "#0000FF"`).

        **PART 5: EXECUTION**
        - **DO NOT** construct a JSON string.
        - **CALL** the `orshot_render_tool` with these specific parameters:
             - templateId: {templateId}
             - modifications: { ...your_fully_populated_map... }
             - crew_run_id: "{crew_run_id}"
        - **OUTPUT ONLY** the S3 URL link returned by the orshot_render_tool.
      </your_task>

    expected_output: >
      The S3 URL link of the rendered image returned by the Orshot API.
      Output ONLY the URL string. Do NOT include any additional text or formatting.
